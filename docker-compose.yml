services:
  # ── PostgreSQL Database ──────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: stockup-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stockup_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockup_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - stockup-network

  # ── Python ML Inference Service (FastAPI) ───────────────────────────
  ml-service:
    build:
      context: ./stockup-backend
      dockerfile: ml/Dockerfile
    container_name: stockup-ml
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - stockup-network

  # ── Spring Boot 3 Java Backend ──────────────────────────────────────
  backend:
    build:
      context: ./stockup-backend
      dockerfile: Dockerfile
    container_name: stockup-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/stockup_ai
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      ML_API_URL: http://ml-service:8001
      REORDER_DEMAND_CSV_PATH: ml/medicine/data/saleshourly.csv
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - stockup-network

  # ── React 19 Frontend + Nginx ───────────────────────────────────────
  frontend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: stockup-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - stockup-network

volumes:
  pgdata:
    driver: local

networks:
  stockup-network:
    driver: bridge
