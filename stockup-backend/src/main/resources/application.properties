# Defer Spring Data JPA repository query validation to first use instead of startup
spring.data.jpa.repositories.bootstrap-mode=deferred

# ML API Configuration
ml.api.url=${ML_API_URL:http://localhost:8001}

# ── Reorder Optimization — Dynamic Safety Stock ────────────────────────────────
# Default lead time in hours (time from placing an order to receiving stock).
# No supplier lead-time data is stored in the database, so this configurable
# default is used. Override per-request via the API if needed.
reorder.default.lead-time-hours=24

# Default service level (probability of not stocking out during lead time).
# Supported values: 0.90 (Z=1.282), 0.95 (Z=1.645), 0.99 (Z=2.326)
reorder.default.service-level=0.95

# Path to historical hourly demand CSV — used READ-ONLY to compute demand variability.
# Relative to the Spring Boot working directory (project root when running via mvn spring-boot:run).
reorder.demand-csv-path=ml/medicine/data/saleshourly.csv

